name: Deploy the phone page

# For the site repo <org>/<org>.github.io, not for claude-web itself (copy this file there, see the README next to the
# .github folder in claude-web's deploy/shell-site/). It builds the phone page of Claude Web from the public repo
# ypyik0669/claude-web at a release tag and serves it at the root of this site. No token or secret is needed.
#
# The daily run deploys a new release of the source repo on its own, with nobody looking: whoever can publish a release
# there, or a compromised build dependency, changes this page within a day. To decide by hand instead, remove the
# `schedule` trigger and run it with a tag. GitHub pauses the schedule after 60 days without activity in this repo
# (re-enable it under Actions). A release without `build:shell` (older than the phone page) is skipped, not built.
# Actions are pinned to commit SHAs (the comment names the release each one is).

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag of ypyik0669/claude-web, e.g. v0.1.6 (empty = the latest release)'
        required: false
        default: ''
      force:
        description: 'Deploy even when this tag is already live'
        type: boolean
        default: false
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

env:
  # where the page is built from (a fork that hosts its own page changes this line)
  SOURCE_REPO: ypyik0669/claude-web

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.pick.outputs.tag }}
      deploy: ${{ steps.pick.outputs.deploy }}
    steps:
      - id: pick
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
          FORCE: ${{ inputs.force }}
          SITE: https://${{ github.repository_owner }}.github.io/
        run: |
          set -euo pipefail
          tag="${INPUT_TAG:-}"
          if [ -z "$tag" ]; then tag="$(gh api "repos/$SOURCE_REPO/releases/latest" --jq .tag_name)"; fi
          re='^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'
          if ! [[ "$tag" =~ $re ]]; then
            echo "::error::not a release tag: $tag"
            exit 1
          fi
          live="$(curl -fsSL --max-time 20 "${SITE}version.txt" 2>/dev/null | head -n 1 || true)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          # releases before the phone page have no build:shell: skip them quietly instead of failing every day
          pkg="$(gh api "repos/$SOURCE_REPO/contents/web/package.json?ref=$tag" --jq .content | base64 -d)"
          if ! printf '%s' "$pkg" | grep -q '"build:shell"'; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "$tag has no phone page yet (no build:shell): nothing to deploy"
          elif [ "$live" = "$tag" ] && [ "${FORCE:-false}" != "true" ]; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "$tag is already live: nothing to deploy"
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            echo "deploying $tag (live: ${live:-none})"
          fi

  build:
    needs: check
    if: needs.check.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ needs.check.outputs.tag }}
          persist-credentials: false
      # no npm cache: a cache restored into a run that deploys is one more thing to trust
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false
      # the page needs the web workspace's build tools and the server's sources only: no install scripts
      - run: npm ci --ignore-scripts
      # a release older than the phone page has no build:shell, and this step fails
      - run: npm run build:shell -w web
      - shell: bash
        env:
          TAG: ${{ needs.check.outputs.tag }}
        run: printf '%s\n' "$TAG" > web/dist-shell/version.txt
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: web/dist-shell

  deploy:
    needs: [check, build]
    runs-on: ubuntu-latest
    # only this job can publish the site
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
