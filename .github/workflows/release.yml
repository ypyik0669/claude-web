name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # One draft for the tag before the builds start. Three jobs creating it at once made three drafts, and finishing
  # meant downloading the installers from two of them and uploading them into the third — two hours for 0.5.12 over a
  # slow line (2026-11-17). electron-builder uploads into an existing draft of the tag.
  draft:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: create the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          n=$(gh api "repos/$REPO/releases?per_page=100" --jq "[.[] | select(.tag_name == \"$TAG\")] | length")
          if [ "$n" = "0" ]; then gh api "repos/$REPO/releases" -f tag_name="$TAG" -f name="${TAG#v}" -F draft=true --jq .id; else echo "a release for $TAG exists ($n)"; fi

  build:
    needs: draft
    # a run without a tag (workflow_dispatch) has no draft job: build anyway (nothing is published)
    if: ${{ !cancelled() && needs.draft.result != 'failure' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --win --x64
            sidecar_platform: win32-x64
          # mac builds run on Electron 43: Electron 44 needs macOS 13, 43 still runs on macOS 12 (2026-11-27, a user on
          # 12.1 got "requires macOS 13.0"); Windows stays on the Electron in package.json
          - os: macos-latest
            args: --mac --arm64 -c.electronVersion=43.8.13
            sidecar_platform: darwin-arm64
          # Intel runner: npm installs the SDK binary and ccb's ripgrep for the runner's own CPU only
          - os: macos-15-intel
            args: --mac --x64 -c.electronVersion=43.8.13
            sidecar_platform: darwin-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: fetch sidecars (pinned, SHA256 checked)
        run: node scripts/sidecars/fetch.mjs --platform ${{ matrix.sidecar_platform }}
      - name: fetch engines (pinned, SHA256 checked)
        run: node scripts/engines/fetch.mjs --platform ${{ matrix.sidecar_platform }}
      # node-datachannel (the phone's direct link) for macOS 12: npm's darwin builds need 12.3 (arm64) / 15.0 (x64);
      # scripts/mac/build-datachannel.sh compiles the installed version for 12.0 and swaps it into node_modules
      - name: node-datachannel version
        if: runner.os == 'macOS'
        id: ndc
        run: echo "v=$(node -p "JSON.parse(require('fs').readFileSync('node_modules/node-datachannel/package.json','utf8')).version")" >> "$GITHUB_OUTPUT"
      - name: node-datachannel built for macOS 12 (cache)
        if: runner.os == 'macOS'
        uses: actions/cache@v4
        with:
          path: vendor/datachannel
          key: datachannel-${{ matrix.sidecar_platform }}-${{ steps.ndc.outputs.v }}-${{ hashFiles('scripts/mac/build-datachannel.sh') }}
      - name: node-datachannel built for macOS 12
        if: runner.os == 'macOS'
        run: bash scripts/mac/build-datachannel.sh vendor/datachannel
      - run: npm run build:all
      - name: package
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --config electron-builder.yml ${{ matrix.args }} --publish ${{ startsWith(github.ref, 'refs/tags/') && 'always' || 'never' }}
      # launch the packaged app for real: embedded server, both engines, node-pty terminal
      - name: smoke test packaged app
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then EXE="dist-desktop/win-unpacked/Claude Web.exe"
          else EXE="$(find dist-desktop -path '*Claude Web.app/Contents/MacOS/Claude Web' -type f | head -1)"; fi
          node scripts/smoke-packaged.mjs "$EXE" "dist-desktop/smoke-${{ strategy.job-index }}.png"
      # every binary in the .app runs on macOS 12 (electron-builder.yml mac.minimumSystemVersion). Allowed above it:
      # the official claude binary (needs 13.0; not used there — server/src/claude-exe.ts officialBinaryRuns) and
      # CLIProxyAPI (says 15.0 from a cgo link on macOS 15; Go 1.26, the last Go for macOS 12, and its imports are all
      # in 12 — checked 2026-11-27). Any Go binary from Go 1.27 on fails, allowed or not
      - name: everything in the app runs on macOS 12
        if: runner.os == 'macOS'
        run: |
          APP="$(find dist-desktop -maxdepth 2 -name 'Claude Web.app' -type d | head -1)"
          node scripts/mac/check-min-os.mjs "$APP" --max 12.0 --go-max 1.26 \
            --allow 'claude-agent-sdk-darwin-[^/]+/claude$' --allow 'engines/darwin-[^/]+/cliproxyapi/cli-proxy-api$'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-screenshot-${{ strategy.job-index }}
          path: dist-desktop/smoke-*.png
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: claude-web-${{ matrix.os }}-${{ strategy.job-index }}
          path: |
            dist-desktop/*.exe
            dist-desktop/*.dmg
            dist-desktop/*.zip
            dist-desktop/*.yml
          if-no-files-found: error

  # Both mac jobs upload latest-mac.yml to the draft and the later one replaces the other: put back one listing both
  # architectures' zip + dmg (from the jobs' artifacts — on GitHub's side, no installer crosses the author's line),
  # and the notes from CHANGELOG.md. Publishing stays a hand step (the draft is checked first).
  finish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: claude-web-macos-*
          path: art
      - name: latest-mac.yml with both architectures, release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          node scripts/release/finish-draft.mjs art "${TAG#v}"
          id=$(gh api "repos/$REPO/releases?per_page=100" --jq "[.[] | select(.tag_name == \"$TAG\" and .draft)][0].id")
          old=$(gh api "repos/$REPO/releases/$id/assets?per_page=100" --jq '.[] | select(.name == "latest-mac.yml") | .id')
          if [ -n "$old" ]; then gh api -X DELETE "repos/$REPO/releases/assets/$old"; fi
          gh api -X POST -H "Content-Type: text/yaml" "https://uploads.github.com/repos/$REPO/releases/$id/assets?name=latest-mac.yml" --input latest-mac.yml --jq .name
          gh api -X PATCH "repos/$REPO/releases/$id" -F body=@notes.md --jq .html_url
          gh api "repos/$REPO/releases/$id/assets?per_page=100" --jq '.[] | "\(.name) \(.size)"'
