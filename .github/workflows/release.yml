name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --win --x64
          - os: macos-latest
            args: --mac --arm64
          # Intel runner: npm installs the SDK binary and ccb's ripgrep for the runner's own CPU only
          - os: macos-15-intel
            args: --mac --x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:all
      - name: package
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --config electron-builder.yml ${{ matrix.args }} --publish ${{ startsWith(github.ref, 'refs/tags/') && 'always' || 'never' }}
      # launch the packaged app for real: embedded server, both engines, node-pty terminal
      - name: smoke test packaged app
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then EXE="dist-desktop/win-unpacked/Claude Web.exe"
          else EXE="$(find dist-desktop -path '*Claude Web.app/Contents/MacOS/Claude Web' -type f | head -1)"; fi
          node scripts/smoke-packaged.mjs "$EXE" "dist-desktop/smoke-${{ strategy.job-index }}.png"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-screenshot-${{ strategy.job-index }}
          path: dist-desktop/smoke-*.png
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: claude-web-${{ matrix.os }}-${{ strategy.job-index }}
          path: |
            dist-desktop/*.exe
            dist-desktop/*.dmg
            dist-desktop/*.zip
            dist-desktop/*.yml
          if-no-files-found: error
