name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the git e2e checks read real history
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:all
      # end-to-end over the real WebSocket with mock agents (no model calls)
      - name: e2e (mock agents; phase 7 reads public GitHub issues with the workflow token)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/e2e.mjs 3 4 5 6 7 11 12
