name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the git e2e checks read real history
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            site/package-lock.json
      - run: npm ci
      - run: npm ci --prefix site
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:all
      - run: npm run build:site
        env:
          SITE_MEDIA: off # the recordings are the deploy's business; a PR check does not download them
      # end-to-end over the real WebSocket with fake upstreams (no model calls)
      - name: e2e (fake upstreams; phase 7 reads public GitHub issues with the workflow token)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/e2e.mjs 3 4 6 7 12
