appId: com.claude-web.desktop
productName: Claude Web
directories:
  output: dist-desktop
  buildResources: desktop/build
publish:
  provider: github
  owner: ypyik0669
  repo: claude-web
extraMetadata:
  main: desktop/dist/main.js
files:
  - package.json
  - desktop/dist/**
  - desktop/package.json
  - server/dist/**
  # 更新内容 reads them (server/src/app/changelog.ts)
  - CHANGELOG.md
  - CHANGELOG.zh-CN.md
  - server/package.json
  - web/dist/**
  - "!**/*.map"
  - "!**/node_modules/.cache/**"
  - "!**/node_modules/**/{test,tests,__tests__,docs,example,examples}/**"
  - "!**/node_modules/**/*.{md,markdown,ts,d.ts,map}"
  - "!node_modules/electron/**"
  - "!node_modules/electron-builder/**"
  - "!node_modules/app-builder-*/**"
  - "!node_modules/@electron/**"
  - "!node_modules/typescript/**"
  - "!node_modules/vite/**"
  - "!node_modules/@vitejs/**"
  - "!node_modules/vitest/**"
  - "!node_modules/tsx/**"
  - "!node_modules/esbuild/**"
  - "!node_modules/@esbuild/**"
  - "!node_modules/rollup/**"
  - "!node_modules/@rollup/**"
  - "!node_modules/react/**"
  - "!node_modules/react-dom/**"
  - "!node_modules/react-markdown/**"
  - "!node_modules/remark-*/**"
  - "!node_modules/@xterm/**"
  - "!node_modules/zustand/**"
asarUnpack:
  - "**/node_modules/@anthropic-ai/claude-agent-sdk-*/**"
  - "**/node_modules/node-pty/**"
  - "**/node_modules/claude-web-engine/**"
  - "**/node_modules/@claude-code-best/**"
  - "**/node_modules/@vscode/ripgrep/**"
  # the engine bundles sharp's JS but not its native binary (a dev dependency upstream): images over 2000 px failed
  # 「Could not load the "sharp" module」; sharp in our dependencies brings the per-platform @img/sharp-* it requires
  - "**/node_modules/sharp/**"
  - "**/node_modules/@img/**"
# 深链接 (claude-web://new?folder=…&q=…): Windows registers it in the installer, macOS in Info.plist
protocols:
  - name: Claude Web
    schemes:
      - claude-web
extraResources:
  - from: desktop/build/icon.png
    to: icon.png
  # pinned Gemini / WorkBuddy sidecars, fetched by scripts/sidecars/fetch.mjs before packaging (CI does this;
  # without them the server downloads on first use into the data directory)
  - from: vendor/sidecars
    to: sidecars
  # CLIProxyAPI / Magpie, fetched by scripts/engines/fetch.mjs before packaging: a fresh install signs in and runs
  # without downloading an engine first (server/src/engines/manager.ts reads <resources>/engines)
  - from: vendor/engines
    to: engines
win:
  target:
    - nsis
    - portable
  icon: desktop/build/icon.png
  artifactName: ClaudeWeb-${version}-${os}-${arch}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  createDesktopShortcut: true
  shortcutName: Claude Web
portable:
  artifactName: ClaudeWeb-${version}-portable.${ext}
mac:
  target:
    - target: dmg
    - target: zip
  category: public.app-category.developer-tools
  icon: desktop/build/icon.png
  artifactName: ClaudeWeb-${version}-mac-${arch}.${ext}
  # unsigned build (no Apple Developer ID): first launch needs right-click → Open, or `xattr -cr "/Applications/Claude Web.app"`
  identity: null
  hardenedRuntime: false
  gatekeeperAssess: false
  darkModeSupport: true
dmg:
  artifactName: ClaudeWeb-${version}-mac-${arch}.${ext}
linux:
  target:
    - AppImage
  category: Development
  icon: desktop/build/icon.png
  artifactName: ClaudeWeb-${version}-linux-${arch}.${ext}
# npm drops the executable bit on some bundled binaries (node-pty spawn-helper, the SDK's claude, ripgrep)
afterPack: scripts/after-pack.cjs
# node-pty ships N-API prebuilds (win32 / darwin); no toolchain needed
npmRebuild: false
